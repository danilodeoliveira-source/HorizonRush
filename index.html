<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon Rush: Enduro Overdrive (3D Arcade)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #050508;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
            border: 4px solid #333;
            border-radius: 6px;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #000;
            image-rendering: pixelated;
        }
        /* Telas de Overlay / Menus */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 15, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .hidden {
            display: none !important;
        }
        h1 {
            font-size: 38px;
            color: #ff0055;
            text-shadow: 3px 3px 0 #00ffff;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        h2 {
            font-size: 22px;
            color: #00ffff;
            margin-bottom: 20px;
        }
        p {
            font-size: 14px;
            color: #ccc;
            margin-bottom: 15px;
            text-align: center;
            max-width: 80%;
            line-height: 1.5;
        }
        .btn-container {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }
        button {
            background: #ff0055;
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 4px 4px 0 #00ffff;
            transition: transform 0.1s;
        }
        button:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 #00ffff;
        }
        button:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 #00ffff;
        }
        .btn-secondary {
            background: #333;
            box-shadow: 4px 4px 0 #888;
        }
        .btn-secondary:hover {
            box-shadow: 6px 6px 0 #888;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="canvas" width="800" height="600"></canvas>

    <!-- Menu Principal -->
    <div id="menu-overlay" class="overlay">
        <h1>Horizon Rush</h1>
        <h2>Enduro Overdrive</h2>
        <p>Complete a trajetória de <strong>40 minutos</strong> através de diversos climas e terrenos: Sol, Neve, Neblina e Tempestade Noturna.</p>
        <p><strong>Controles:</strong> Setas [←][→] Direção | [↑] Acelerar / Boost | [ESC] Pausa</p>
        <div class="btn-container">
            <button id="btn-start">INICIAR CORRIDA</button>
        </div>
    </div>

    <!-- Menu de Pausa -->
    <div id="pause-overlay" class="overlay hidden">
        <h1>JOGO PAUSADO</h1>
        <div class="btn-container">
            <button id="btn-resume">CONTINUAR</button>
            <button id="btn-exit" class="btn-secondary">SAIR PARA O MENU</button>
        </div>
    </div>

    <!-- Tela de Fim de Jogo -->
    <div id="gameover-overlay" class="overlay hidden">
        <h1 id="gameover-title">FIM DE JOGO</h1>
        <p id="gameover-desc"></p>
        <div class="btn-container">
            <button id="btn-restart">TENTAR NOVAMENTE</button>
            <button id="btn-main-menu" class="btn-secondary">MENU PRINCIPAL</button>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// Elementos de UI
const menuOverlay = document.getElementById('menu-overlay');
const pauseOverlay = document.getElementById('pause-overlay');
const gameoverOverlay = document.getElementById('gameover-overlay');
const gameoverTitle = document.getElementById('gameover-title');
const gameoverDesc = document.getElementById('gameover-desc');

document.getElementById('btn-start').addEventListener('click', startGame);
document.getElementById('btn-resume').addEventListener('click', togglePause);
document.getElementById('btn-exit').addEventListener('click', exitToMenu);
document.getElementById('btn-restart').addEventListener('click', startGame);
document.getElementById('btn-main-menu').addEventListener('click', exitToMenu);

// Estados do Jogo
const STATE = { MENU: 0, PLAYING: 1, PAUSED: 2, GAMEOVER: 3 };
let currentState = STATE.MENU;

// Duração total: 40 minutos (em segundos = 2400s)
const TOTAL_DURATION_SECONDS = 2400; 
let elapsedTime = 0;
let lastTimestamp = 0;

// Definição dos Ambientes da Trajetória (40 Minutos)
const ENVIRONMENTS = [
    { name: "Costeira Ensolarada", durationRatio: 0.20, sky: "#3388ff", grass: "#108810", road: "#333", weather: "clear" },
    { name: "Serra Nevada",       durationRatio: 0.25, sky: "#a0c0d0", grass: "#e0e8f0", road: "#444", weather: "snow" },
    { name: "Vale da Neblina",    durationRatio: 0.25, sky: "#556666", grass: "#203820", road: "#2a2a2a", weather: "fog" },
    { name: "Pôr do Sol no Deserto", durationRatio: 0.15, sky: "#ff5500", grass: "#c28d38", road: "#3a2a20", weather: "clear" },
    { name: "Tempestade Noturna",  durationRatio: 0.15, sky: "#050510", grass: "#081008", road: "#151515", weather: "snow_fog" }
];

// Motor Pseudo-3D
const ROAD_WIDTH = 2000;
const SEGMENT_LENGTH = 200;
const CAMERA_DEPTH = 0.8;
let segments = [];
let trackLength = 0;
let playerZ = 0;
let playerX = 0; // -1 a 1
let speed = 0;
const MAX_SPEED = 240;
const ACCEL = 80;
const DECEL = 100;

// Tráfego
let cars = [];

// Partículas Climáticas (Neve/Neblina)
let particles = [];
for(let i=0; i<150; i++) {
    particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 3 + 1,
        speedY: Math.random() * 2 + 1,
        speedX: Math.random() * 2 - 1
    });
}

// Teclas
const keys = {};
window.addEventListener('keydown', e => {
    if (e.code === 'KeyP' || e.code === 'Escape') {
        if (currentState === STATE.PLAYING || currentState === STATE.PAUSED) {
            togglePause();
        }
    }
    keys[e.code] = true;
});
window.addEventListener('keyup', e => keys[e.code] = false);

// Construção da Pista
function buildTrack() {
    segments = [];
    const numSegments = 1500;
    for (let i = 0; i < numSegments; i++) {
        let curve = 0;
        if (i > 100 && i < 300) curve = 2;
        if (i > 400 && i < 600) curve = -2.5;
        if (i > 700 && i < 900) curve = 3;
        if (i > 1100 && i < 1300) curve = -1.8;

        segments.push({
            index: i,
            point: { world: { z: i * SEGMENT_LENGTH }, screen: {} },
            curve: curve
        });
    }
    trackLength = segments.length * SEGMENT_LENGTH;
}

// Iniciar Jogo
function startGame() {
    buildTrack();
    elapsedTime = 0;
    playerZ = 0;
    playerX = 0;
    speed = 0;
    spawnTraffic();
    
    menuOverlay.classList.add('hidden');
    pauseOverlay.classList.add('hidden');
    gameoverOverlay.classList.add('hidden');
    
    currentState = STATE.PLAYING;
    lastTimestamp = performance.now();
}

function togglePause() {
    if (currentState === STATE.PLAYING) {
        currentState = STATE.PAUSED;
        pauseOverlay.classList.remove('hidden');
    } else if (currentState === STATE.PAUSED) {
        currentState = STATE.PLAYING;
        pauseOverlay.classList.add('hidden');
        lastTimestamp = performance.now();
    }
}

function exitToMenu() {
    currentState = STATE.MENU;
    pauseOverlay.classList.add('hidden');
    gameoverOverlay.classList.add('hidden');
    menuOverlay.classList.remove('hidden');
}

// Gerar Tráfego
function spawnTraffic() {
    cars = [];
    const carColors = ['#cc1111', '#1188cc', '#e6b800', '#11cc55', '#9911cc'];
    for (let i = 0; i < 40; i++) {
        cars.push({
            offset: (Math.random() * 1.4) - 0.7,
            z: Math.random() * trackLength,
            speed: 80 + Math.random() * 60,
            color: carColors[Math.floor(Math.random() * carColors.length)]
        });
    }
}

// Identificar Ambiente Atual com base no tempo decorrido
function getCurrentEnv() {
    let progress = elapsedTime / TOTAL_DURATION_SECONDS;
    if (progress > 1) progress = 1;
    
    let accumulated = 0;
    for (let env of ENVIRONMENTS) {
        accumulated += env.durationRatio;
        if (progress <= accumulated) return env;
    }
    return ENVIRONMENTS[ENVIRONMENTS.length - 1];
}

// Projeção Pseudo-3D
function project(p, cameraX, cameraY, cameraZ) {
    p.camera = {
        x: (p.world.x || 0) - cameraX,
        y: (p.world.y || 0) - cameraY,
        z: (p.world.z || 0) - cameraZ
    };
    p.screen.scale = CAMERA_DEPTH / (p.camera.z || 0.0001);
    p.screen.x = Math.round((canvas.width / 2) + (p.screen.scale * p.camera.x * canvas.width / 2));
    p.screen.y = Math.round((canvas.height / 2) - (p.screen.scale * p.camera.y * canvas.height / 2));
    p.screen.w = Math.round(p.screen.scale * ROAD_WIDTH * canvas.width / 2);
}

// Atualização de Lógica
function update(dt) {
    if (currentState !== STATE.PLAYING) return;

    elapsedTime += dt;
    if (elapsedTime >= TOTAL_DURATION_SECONDS) {
        currentState = STATE.GAMEOVER;
        gameoverTitle.innerText = "JORNADA CONCLUÍDA!";
        gameoverDesc.innerText = "Parabéns! Você completou os 40 minutos da travessia de Enduro Overdrive!";
        gameoverOverlay.classList.remove('hidden');
        return;
    }

    const env = getCurrentEnv();

    // Controles do Jogador
    if (keys['ArrowUp']) speed += ACCEL * dt;
    else if (keys['ArrowDown']) speed -= DECEL * 1.5 * dt;
    else speed -= DECEL * 0.5 * dt;

    // Efeito de Pista Escorregadia na Neve
    let handling = 1.8;
    if (env.weather === 'snow' || env.weather === 'snow_fog') handling = 1.1;

    if (keys['ArrowLeft']) playerX -= handling * dt;
    if (keys['ArrowRight']) playerX += handling * dt;

    // Limites de Velocidade
    speed = Math.max(0, Math.min(speed, MAX_SPEED));

    // Deslocamento na Pista
    playerZ += speed * 10 * dt;
    if (playerZ >= trackLength) playerZ -= trackLength;

    // Curvatura afetando posição X
    const currentSegmentIndex = Math.floor(playerZ / SEGMENT_LENGTH) % segments.length;
    const currentSegment = segments[currentSegmentIndex];
    playerX -= (currentSegment.curve * (speed / MAX_SPEED) * 0.005);

    // Saída de Pista (Grama)
    if (playerX < -1 || playerX > 1) {
        if (speed > 60) speed -= ACCEL * 2 * dt;
    }

    // Atualizar Tráfego & Colisão
    cars.forEach(car => {
        car.z += car.speed * 10 * dt;
        if (car.z >= trackLength) car.z -= trackLength;

        // Verificar Colisão
        if (Math.abs(playerZ - car.z) < 120) {
            if (Math.abs(playerX - car.offset) < 0.35) {
                speed = 30; // Desaceleração brusca por batida
            }
        }
    });

    // Atualizar Partículas Climatológicas
    if (env.weather.includes('snow')) {
        particles.forEach(p => {
            p.y += p.speedY + (speed / 40);
            p.x += p.speedX;
            if (p.y > canvas.height) p.y = 0;
            if (p.x > canvas.width) p.x = 0;
            if (p.x < 0) p.x = canvas.width;
        });
    }
}

// Renderizar Polígono Trapezoidal da Pista
function drawPoly(x1, y1, w1, x2, y2, w2, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x1 - w1, y1);
    ctx.lineTo(x2 - w2, y2);
    ctx.lineTo(x2 + w2, y2);
    ctx.lineTo(x1 + w1, y1);
    ctx.closePath();
    ctx.fill();
}

// Renderização Gráfica
function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const env = getCurrentEnv();

    // 1. Céu
    ctx.fillStyle = env.sky;
    ctx.fillRect(0, 0, canvas.width, canvas.height / 2);

    // Sol / Lua
    if (env.weather === 'clear') {
        ctx.fillStyle = '#fffae0';
        ctx.beginPath();
        ctx.arc(650, 100, 40, 0, Math.PI * 2);
        ctx.fill();
    }

    // 2. Campo/Grama Base
    ctx.fillStyle = env.grass;
    ctx.fillRect(0, canvas.height / 2, canvas.width, canvas.height / 2);

    // 3. Renderização da Pista Pseudo-3D
    const baseSegmentIndex = Math.floor(playerZ / SEGMENT_LENGTH);
    let dx = 0;
    let camX = playerX * ROAD_WIDTH;

    for (let n = 0; n < 100; n++) {
        let segIndex = (baseSegmentIndex + n) % segments.length;
        let seg = segments[segIndex];
        
        let loopOffset = (baseSegmentIndex + n >= segments.length) ? trackLength : 0;
        
        project(seg.point, camX - dx, 1000, playerZ - loopOffset);
        dx += seg.curve * 15;

        if (n > 0) {
            let prevSegIndex = (baseSegmentIndex + n - 1) % segments.length;
            let prevSeg = segments[prevSegIndex];

            if (seg.point.screen.y < prevSeg.point.screen.y) {
                // Zebra / Faixas Vermelhas e Brancas
                let stripeColor = (segIndex % 4 < 2) ? '#ff0000' : '#ffffff';
                let roadColor = (segIndex % 2 === 0) ? env.road : '#222222';

                // Grama
                drawPoly(0, prevSeg.point.screen.y, canvas.width, 0, seg.point.screen.y, canvas.width, env.grass);
                // Zebra Externa
                drawPoly(prevSeg.point.screen.x, prevSeg.point.screen.y, prevSeg.point.screen.w * 1.15,
                         seg.point.screen.x, seg.point.screen.y, seg.point.screen.w * 1.15, stripeColor);
                // Asfalto
                drawPoly(prevSeg.point.screen.x, prevSeg.point.screen.y, prevSeg.point.screen.w,
                         seg.point.screen.x, seg.point.screen.y, seg.point.screen.w, roadColor);
                // Faixa Central
                if (segIndex % 4 < 2) {
                    drawPoly(prevSeg.point.screen.x, prevSeg.point.screen.y, prevSeg.point.screen.w * 0.03,
                             seg.point.screen.x, seg.point.screen.y, seg.point.screen.w * 0.03, '#ffffff');
                }
            }
        }
    }

    // 4. Renderizar Carros de Tráfego (Detalhados)
    cars.forEach(car => {
        let relZ = car.z - playerZ;
        if (relZ < 0) relZ += trackLength;

        if (relZ > 0 && relZ < 15000) {
            let scale = CAMERA_DEPTH / relZ;
            let screenX = (canvas.width / 2) + (scale * (car.offset * ROAD_WIDTH - playerX * ROAD_WIDTH) * canvas.width / 2);
            let screenY = (canvas.height / 2) + (scale * 1000 * canvas.height / 2);
            let w = scale * 450 * canvas.width;
            let h = scale * 300 * canvas.height;

            if (screenY > canvas.height / 2 && screenY < canvas.height) {
                // Corpo do Carro
                ctx.fillStyle = car.color;
                ctx.fillRect(screenX - w/2, screenY - h, w, h * 0.6);
                // Teto
                ctx.fillStyle = '#111';
                ctx.fillRect(screenX - w*0.35, screenY - h * 1.1, w * 0.7, h * 0.5);
                // Lanternas Traseiras (Vermelho)
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(screenX - w*0.45, screenY - h*0.5, w*0.2, h*0.15);
                ctx.fillRect(screenX + w*0.25, screenY - h*0.5, w*0.2, h*0.15);
                // Placa
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(screenX - w*0.1, screenY - h*0.3, w*0.2, h*0.1);
            }
        }
    });

    // 5. Renderizar Carro do Jogador (Detalhamento Exclusivo em Tons de CINZA)
    drawPlayerCar();

    // 6. Efeitos Climáticos (Neve e Neblina)
    if (env.weather.includes('fog')) {
        let gradient = ctx.createLinearGradient(0, canvas.height/2, 0, canvas.height);
        gradient.addColorStop(0, 'rgba(200, 210, 220, 0.85)');
        gradient.addColorStop(1, 'rgba(200, 210, 220, 0.1)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    if (env.weather.includes('snow')) {
        ctx.fillStyle = '#ffffff';
        particles.forEach(p => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
        });
    }

    // 7. HUD (Painel de Informações)
    drawHUD(env);
}

// Desenhar Carro do Jogador (Cinza Metálico Detalhado)
function drawPlayerCar() {
    const x = canvas.width / 2;
    const y = canvas.height - 30;
    const w = 160;
    const h = 80;

    // Sombra do Carro
    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
    ctx.beginPath();
    ctx.ellipse(x, y - 5, w * 0.55, 15, 0, 0, Math.PI * 2);
    ctx.fill();

    // Pneus Traseiros
    ctx.fillStyle = '#111111';
    ctx.fillRect(x - w * 0.52, y - 25, 24, 30);
    ctx.fillRect(x + w * 0.38, y - 25, 24, 30);

    // Chassi / Parachoque (Cinza Escuro)
    ctx.fillStyle = '#444444';
    ctx.fillRect(x - w * 0.48, y - 35, w * 0.96, 25);

    // Lataria Principal (Cinza Prata)
    ctx.fillStyle = '#888888';
    ctx.fillRect(x - w * 0.45, y - 55, w * 0.9, 25);

    // Destaque Metálico (Linha de Brilho Prateado)
    ctx.fillStyle = '#bbbbbb';
    ctx.fillRect(x - w * 0.43, y - 53, w * 0.86, 4);

    // Vidro Traseiro (Escuro com Reflexo)
    ctx.fillStyle = '#1a2530';
    ctx.beginPath();
    ctx.moveTo(x - w * 0.3, y - 55);
    ctx.lineTo(x - w * 0.22, y - 78);
    ctx.lineTo(x + w * 0.22, y - 78);
    ctx.lineTo(x + w * 0.3, y - 55);
    ctx.closePath();
    ctx.fill();

    // Aerofólio (Cinza Prata)
    ctx.fillStyle = '#666666';
    ctx.fillRect(x - w * 0.46, y - 62, w * 0.92, 6);

    // Lanternas Traseiras (Acesas)
    ctx.fillStyle = '#ff0033';
    ctx.shadowColor = '#ff0000';
    ctx.shadowBlur = 10;
    ctx.fillRect(x - w * 0.42, y - 48, 30, 8);
    ctx.fillRect(x + w * 0.42 - 30, y - 48, 30, 8);
    ctx.shadowBlur = 0; // Reseta sombra

    // Escapamentos
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(x - 25, y - 12, 5, 0, Math.PI * 2);
    ctx.arc(x + 25, y - 12, 5, 0, Math.PI * 2);
    ctx.fill();
}

// HUD (Painel de Instrumentos Arcade)
function drawHUD(env) {
    // Barra do HUD Topo
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(0, 0, canvas.width, 50);

    ctx.fillStyle = '#00ffff';
    ctx.font = 'bold 16px Courier New';
    
    // Velocidade
    ctx.fillText(`${Math.round(speed)} KM/H`, 20, 30);

    // Tempo Decorrido & Total (40 Min)
    let currentMin = Math.floor(elapsedTime / 60);
    let currentSec = Math.floor(elapsedTime % 60);
    let minStr = currentMin < 10 ? '0' + currentMin : currentMin;
    let secStr = currentSec < 10 ? '0' + currentSec : currentSec;
    
    ctx.fillStyle = '#ffffff';
    ctx.fillText(`TEMPO: ${minStr}:${secStr} / 40:00`, 260, 30);

    // Clima / Ambiente
    ctx.fillStyle = '#ff0055';
    ctx.fillText(`LOCAL: ${env.name.toUpperCase()}`, 520, 30);

    // Barra de Progresso da Trajetória (40 Minutos)
    ctx.fillStyle = '#333333';
    ctx.fillRect(20, 42, canvas.width - 40, 4);
    ctx.fillStyle = '#00ffff';
    ctx.fillRect(20, 42, (canvas.width - 40) * (elapsedTime / TOTAL_DURATION_SECONDS), 4);
}

// Loop Principal
function gameLoop(timestamp) {
    let dt = (timestamp - lastTimestamp) / 1000;
    if (isNaN(dt) || dt > 0.1) dt = 0.1;
    lastTimestamp = timestamp;

    update(dt);
    render();

    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
