<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enduro 8-Bit Arcade</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #05050a;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Gabinete Arcade */
        #cabinet {
            position: relative;
            background: #151520;
            padding: 16px;
            border: 6px solid #ff0055;
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(255, 0, 85, 0.5), inset 0 0 20px rgba(0, 0, 0, 0.8);
        }

        canvas {
            display: block;
            width: 800px;
            height: 560px;
            background: #000000;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            border: 4px solid #111111;
        }

        .overlay {
            position: absolute;
            top: 16px;
            left: 16px;
            width: 800px;
            height: 560px;
            background: rgba(5, 5, 12, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 36px;
            color: #ffe600;
            text-shadow: 4px 4px 0 #ff0055, -2px -2px 0 #00ffff;
            margin-bottom: 8px;
            letter-spacing: 3px;
            text-align: center;
        }

        h2 {
            font-size: 18px;
            color: #00ffff;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0 #000000;
        }

        p {
            font-size: 13px;
            color: #dddddd;
            margin-bottom: 12px;
            text-align: center;
            max-width: 85%;
            line-height: 1.6;
        }

        .controls-box {
            background: #222233;
            border: 2px dashed #00ffff;
            padding: 10px 18px;
            margin: 15px 0;
            font-size: 12px;
            color: #ffff88;
            text-align: center;
        }

        .btn-group {
            display: flex;
            gap: 16px;
            margin-top: 15px;
        }

        button {
            background: #ff0055;
            color: #ffffff;
            border: 3px solid #ffffff;
            padding: 12px 24px;
            font-size: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 4px 4px 0 #000000;
            text-transform: uppercase;
        }

        button:hover {
            background: #ff3377;
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 #000000;
        }

        button:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 #000000;
        }

        .btn-sec {
            background: #444455;
            border-color: #aaaaaa;
        }
    </style>
</head>
<body>

<div id="cabinet">
    <canvas id="game" width="320" height="224"></canvas>

    <div id="menu-overlay" class="overlay">
        <h1>ENDURO 8-BIT</h1>
        <h2>EDITION MULTI-PISTAS</h2>
        <p>Pista mais larga, novas zonas (Cidade, Rio, Túnel, Floresta) e rodopios nas colisões!</p>
        
        <div class="controls-box">
            [SETAS ESQ / DIR] Direção &nbsp;|&nbsp; [SETA CIMA] Acelerar &nbsp;|&nbsp; [SETA BAIXO] Frear<br>
            [P] ou [ESC] Pausar
        </div>

        <div class="btn-group">
            <button id="btn-start">INICIAR CORRIDA</button>
        </div>
    </div>

    <div id="pause-overlay" class="overlay hidden">
        <h1 style="color:#00ffff; text-shadow:4px 4px 0 #ff0055;">PAUSADO</h1>
        <p>Sua corrida está temporariamente interrompida.</p>
        <div class="btn-group">
            <button id="btn-resume">CONTINUAR</button>
            <button id="btn-exit" class="btn-sec">SAIR PARA O MENU</button>
        </div>
    </div>

    <div id="gameover-overlay" class="overlay hidden">
        <h1 id="go-title">FIM DE JOGO</h1>
        <p id="go-desc"></p>
        <div class="btn-group">
            <button id="btn-restart">TENTAR NOVAMENTE</button>
            <button id="btn-main" class="btn-sec">MENU PRINCIPAL</button>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const menuOverlay = document.getElementById('menu-overlay');
const pauseOverlay = document.getElementById('pause-overlay');
const gameoverOverlay = document.getElementById('gameover-overlay');
const goTitle = document.getElementById('go-title');
const goDesc = document.getElementById('go-desc');

document.getElementById('btn-start').onclick = () => { initAudio(); startGame(); };
document.getElementById('btn-resume').onclick = togglePause;
document.getElementById('btn-exit').onclick = exitToMenu;
document.getElementById('btn-restart').onclick = startGame;
document.getElementById('btn-main').onclick = exitToMenu;

const STATE = { MENU: 0, PLAYING: 1, PAUSED: 2, GAMEOVER: 3 };
let gameState = STATE.MENU;

let vidas = 5;
const TOTAL_TIME = 2400;
let elapsedTime = 0;
let carsPassed = 0;
let lastTime = 0;
let spinTimer = 0; // Controle do rodopio ao bater

// PISTAS E AMBIENTES DIVERSIFICADOS
const ENVIRONMENTS = [
    { name: "1. CIDADE ILUMINADA", duration: 400, sky: "#111122", grass: "#222233", road: "#353540", type: "city" },
    { name: "2. PONTE SOBRE O RIO", duration: 400, sky: "#55aaff", grass: "#1155bb", road: "#444444", type: "river" },
    { name: "3. TÚNEL SUBTERRÂNEO", duration: 400, sky: "#050505", grass: "#151515", road: "#252525", type: "tunnel" },
    { name: "4. FLORESTA FECHADA", duration: 400, sky: "#1b3b1b", grass: "#0a290a", road: "#302820", type: "forest" },
    { name: "5. SERRA NEVADA",       duration: 400, sky: "#88a8c0", grass: "#e8eff8", road: "#505060", type: "snow" },
    { name: "6. TEMPESTADE NOTURNA", duration: 400, sky: "#080818", grass: "#081808", road: "#181820", type: "night" }
];

function getEnv(t) {
    let acc = 0;
    for (let e of ENVIRONMENTS) {
        acc += e.duration;
        if (t <= acc) return e;
    }
    return ENVIRONMENTS[ENVIRONMENTS.length - 1];
}

// FÍSICA E PISTA (MAIOR E MAIS FÁCIL)
let speed = 0;
const MAX_SPEED = 200;
const ACCEL = 100; // Aceleração rápida
const DECEL = 100;
let playerX = 0; 
let distance = 0;
let curve = 0;
let targetCurve = 0;
let curveTimer = 0;

const PLAYER_SPRITE = [
    "....SSSSSSSS....",
    "...SGGGGGGGG....",
    "..SGGDDDDGGGG...",
    ".BGGDDDDDDGGGB..",
    ".BGGGDDDDGGGGB..",
    "BGGGGGGGGGGGGGB.",
    "BGGGRRRRRRRGGGB.",
    "BGGGRRRRRRRGGGB.",
    ".EEDDDDDDDDDDEE.",
    "..EE........EE.."
];

const ENEMY_COLORS = ['#e02020', '#2080e0', '#e0a020', '#20b040', '#a020d0'];
const ENEMY_SPRITE = [
    "...LLLLLLLL...",
    "..LCCCCCCCC...",
    ".BWWWWWWWWWW.B",
    ".BCCCCCCCCCC.B",
    ".BCCRRCCRRCC.B",
    ".BBDDDDDDDDB.B"
];

// TRÁFEGO REDUZIDO (Facilitando ultrapassagens)
let traffic = [];
function spawnTraffic() {
    traffic = [];
    for (let i = 0; i < 4; i++) { // Apenas 4 carros por vez
        traffic.push({
            x: (Math.random() * 1.2) - 0.6,
            z: 250 + i * 280 + Math.random() * 50,
            speed: 10 + Math.random() * 15,
            color: ENEMY_COLORS[Math.floor(Math.random() * ENEMY_COLORS.length)]
        });
    }
}

// ÁUDIO SINTETIZADO
let audioCtx = null;
let engineOsc = null;
let engineGain = null;

function initAudio() {
    if (audioCtx) return;
    try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        engineOsc = audioCtx.createOscillator();
        engineGain = audioCtx.createGain();
        engineOsc.type = 'sawtooth';
        engineOsc.frequency.setValueAtTime(40, audioCtx.currentTime);
        engineGain.gain.setValueAtTime(0.03, audioCtx.currentTime);
        engineOsc.connect(engineGain);
        engineGain.connect(audioCtx.destination);
        engineOsc.start();
    } catch(e) {}
}

function updateAudio() {
    if (!audioCtx || !engineOsc) return;
    if (gameState === STATE.PLAYING) {
        engineGain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        let freq = 40 + (speed / MAX_SPEED) * 120;
        engineOsc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    } else {
        engineGain.gain.setValueAtTime(0.0, audioCtx.currentTime);
    }
}

function playCrashSound() {
    if (!audioCtx) return;
    try {
        let osc = audioCtx.createOscillator();
        let g = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(140, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.4);
        g.gain.setValueAtTime(0.2, audioCtx.currentTime);
        g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.4);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
    } catch(e) {}
}

const keys = {};
window.onkeydown = e => {
    if (e.code === 'KeyP' || e.code === 'Escape') {
        if (gameState === STATE.PLAYING || gameState === STATE.PAUSED) togglePause();
    }
    keys[e.code] = true;
};
window.onkeyup = e => keys[e.code] = false;

function startGame() {
    vidas = 5;
    elapsedTime = 0;
    carsPassed = 0;
    speed = 0;
    playerX = 0;
    distance = 0;
    curve = 0;
    targetCurve = 0;
    spinTimer = 0;
    spawnTraffic();

    menuOverlay.classList.add('hidden');
    pauseOverlay.classList.add('hidden');
    gameoverOverlay.classList.add('hidden');

    gameState = STATE.PLAYING;
    lastTime = performance.now();
}

function togglePause() {
    if (gameState === STATE.PLAYING) {
        gameState = STATE.PAUSED;
        pauseOverlay.classList.remove('hidden');
    } else if (gameState === STATE.PAUSED) {
        gameState = STATE.PLAYING;
        pauseOverlay.classList.add('hidden');
        lastTime = performance.now();
    }
    updateAudio();
}

function exitToMenu() {
    gameState = STATE.MENU;
    pauseOverlay.classList.add('hidden');
    gameoverOverlay.classList.add('hidden');
    menuOverlay.classList.remove('hidden');
    updateAudio();
}

function update(dt) {
    if (gameState !== STATE.PLAYING) return;

    elapsedTime += dt;
    if (elapsedTime >= TOTAL_TIME) {
        gameState = STATE.GAMEOVER;
        goTitle.innerText = "VITÓRIA LENDÁRIA!";
        goDesc.innerText = `Você dominou todas as pistas! Ultrapassou ${carsPassed} veículos!`;
        gameoverOverlay.classList.remove('hidden');
        updateAudio();
        return;
    }

    const env = getEnv(elapsedTime);

    // Efeito de Girada ao Bater
    if (spinTimer > 0) {
        spinTimer -= dt;
        speed = Math.max(0, speed - 180 * dt); // Perde velocidade enquanto gira
    } else {
        // Curvatura suave da pista (fácil)
        curveTimer -= dt;
        if (curveTimer <= 0) {
            curveTimer = 4 + Math.random() * 4;
            targetCurve = (Math.random() * 2 - 1) * 0.6; 
        }
        curve += (targetCurve - curve) * dt * 0.8;

        // Aceleração e Freio
        if (keys['ArrowUp']) speed += ACCEL * dt;
        else if (keys['ArrowDown']) speed -= DECEL * 1.6 * dt;
        else speed -= DECEL * 0.4 * dt;

        // Controle responsivo
        let handling = 2.0;
        if (keys['ArrowLeft']) playerX -= handling * dt;
        if (keys['ArrowRight']) playerX += handling * dt;
    }

    speed = Math.max(0, Math.min(speed, MAX_SPEED));
    distance += speed * dt * 10;

    // Efeito suave da curva no carro
    playerX -= curve * (speed / MAX_SPEED) * 0.3 * dt;

    // FORA DA PISTA (JOGADOR FICA ATOLADO)
    if (playerX < -1.0 || playerX > 1.0) {
        if (speed > 35) {
            speed -= ACCEL * 3.5 * dt; // Fica atolado na grama/água
        }
    }

    // Tráfego
    traffic.forEach(car => {
        let relSpeed = speed + car.speed;
        car.z -= relSpeed * dt * 8;

        if (car.z < -20) {
            car.z += 1200 + Math.random() * 200;
            car.x = (Math.random() * 1.4) - 0.7;
            car.color = ENEMY_COLORS[Math.floor(Math.random() * ENEMY_COLORS.length)];
            carsPassed++;
        }

        // Colisão (se não estiver rodopiando)
        if (spinTimer <= 0 && Math.abs(car.z) < 20 && Math.abs(playerX - car.x) < 0.32) {
            vidas--;
            spinTimer = 0.55; // Dispara o rodopio
            playCrashSound();
            car.z += 120; 

            if (vidas <= 0) {
                gameState = STATE.GAMEOVER;
                goTitle.innerText = "FIM DE JOGO";
                goDesc.innerText = `Você perdeu todas as vidas! Ultrapassou ${carsPassed} carros.`;
                gameoverOverlay.classList.remove('hidden');
                updateAudio();
                return;
            }
        }
    });

    updateAudio();
}

function render() {
    const env = getEnv(elapsedTime);

    // 1. CÉU / CENÁRIOS DIVERSOS
    ctx.fillStyle = env.sky;
    ctx.fillRect(0, 0, 320, 80);

    if (env.type === 'city') {
        // Prédios iluminados na Cidade
        ctx.fillStyle = '#1c1c2e';
        for (let i = 0; i < 320; i += 20) {
            let h = 25 + (i % 3) * 12;
            ctx.fillRect(i, 80 - h, 18, h);
            ctx.fillStyle = '#ffff77';
            if (i % 4 === 0) ctx.fillRect(i + 4, 80 - h + 6, 4, 4);
            ctx.fillStyle = '#1c1c2e';
        }
    } else if (env.type === 'forest') {
        // Árvores na Floresta
        ctx.fillStyle = '#0f1a0f';
        for (let i = 0; i < 320; i += 16) {
            let h = 20 + (i % 5) * 6;
            ctx.fillRect(i, 80 - h, 12, h);
        }
    } else if (env.type === 'tunnel') {
        // Teto e Iluminação do Túnel
        ctx.fillStyle = '#101010';
        ctx.fillRect(0, 0, 320, 75);
        ctx.fillStyle = '#ffaa00';
        for (let i = 20; i < 320; i += 60) {
            ctx.fillRect(i, 70, 16, 4);
        }
    } else {
        // Montanhas de Fundo
        ctx.fillStyle = (env.type === 'snow') ? '#c0d0e0' : '#102030';
        for(let i = 0; i < 320; i += 16) {
            let h = Math.sin(i * 0.05 + curve) * 8 + 12;
            ctx.fillRect(i, 80 - h, 16, h);
        }
    }

    // 2. LATERAIS DA PISTA
    ctx.fillStyle = env.grass;
    ctx.fillRect(0, 80, 320, 144);

    // 3. PISTA EXPANDIDA (MAIOR)
    const horizonY = 80;
    const roadH = 130;

    for (let y = horizonY; y < horizonY + roadH; y++) {
        let p = (y - horizonY) / roadH;
        let p2 = p * p;

        // Largura base expandida para 230
        let roadW = 10 + p2 * 230; 
        let centerX = 160 + (curve * 80 * p2) - (playerX * 85 * p);

        let zPos = distance * 0.15 + (12 / (p + 0.04));
        let isStripe = (Math.floor(zPos) % 2) === 0;

        let kerbW = 4 + p2 * 14;
        let stripeColor = isStripe ? '#e02020' : '#ffffff';
        let roadColor = (Math.floor(zPos) % 4 < 2) ? env.road : '#282828';

        ctx.fillStyle = env.grass;
        ctx.fillRect(0, y, 320, 1);

        if (env.type === 'river') {
            stripeColor = isStripe ? '#3388ff' : '#ffffff';
        }

        // Zebras
        ctx.fillStyle = stripeColor;
        ctx.fillRect(centerX - roadW/2 - kerbW, y, kerbW, 1);
        ctx.fillRect(centerX + roadW/2, y, kerbW, 1);

        // Asfalto
        ctx.fillStyle = roadColor;
        ctx.fillRect(centerX - roadW/2, y, roadW, 1);

        // Linhas de Faixa Dupla
        if (isStripe) {
            ctx.fillStyle = (env.type === 'city') ? '#ffcc00' : '#ffffff';
            ctx.fillRect(centerX - roadW*0.2, y, 2, 1);
            ctx.fillRect(centerX + roadW*0.2, y, 2, 1);
        }
    }

    // 4. CARROS OPONENTES
    traffic.forEach(car => {
        if (car.z > 10 && car.z < 1000) {
            let p = 100 / car.z;
            let screenY = horizonY + (p * roadH * 0.85);

            if (screenY >= horizonY && screenY < 205) {
                let p2 = Math.pow((screenY - horizonY)/roadH, 2);
                let roadW = 10 + p2 * 230;
                let centerX = 160 + (curve * 80 * p2) - (playerX * 85 * (screenY - horizonY)/roadH);
                let screenX = centerX + (car.x * roadW * 0.45);

                let scale = p * 1.25;
                if (scale > 0.1 && scale < 2.3) {
                    drawSpriteMatrix(ENEMY_SPRITE, screenX, screenY, scale, car.color);
                }
            }
        }
    });

    // 5. CARRO DO JOGADOR COM GIRO DE COLISÃO
    let playerY = 188;
    let playerScreenX = 160;

    ctx.save();
    if (spinTimer > 0) {
        // Efeito de rodopio ao colidir
        let angle = (0.55 - spinTimer) * Math.PI * 8; 
        ctx.translate(playerScreenX, playerY - 10);
        ctx.rotate(angle);
        drawPlayerSprite(0, 10);
    } else {
        drawPlayerSprite(playerScreenX, playerY);
    }
    ctx.restore();

    // 6. HUD
    drawHUD(env);
}

function drawPlayerSprite(cx, cy) {
    const pw = 2;
    const rows = PLAYER_SPRITE.length;
    const cols = PLAYER_SPRITE[0].length;
    const startX = cx - (cols * pw) / 2;
    const startY = cy - (rows * pw);

    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            let ch = PLAYER_SPRITE[r][c];
            if (ch === '.') continue;

            let color = '#888888';
            if (ch === 'S') color = '#ffffff';
            if (ch === 'G') color = '#aaaaaa';
            if (ch === 'D') color = '#444444';
            if (ch === 'B') color = '#111111';
            if (ch === 'R') color = keys['ArrowDown'] ? '#ff0000' : '#aa0000';
            if (ch === 'E') color = '#222222';

            ctx.fillStyle = color;
            ctx.fillRect(startX + c * pw, startY + r * pw, pw, pw);
        }
    }
}

function drawSpriteMatrix(sprite, cx, cy, scale, primaryColor) {
    const pw = Math.max(1, Math.round(1.8 * scale));
    const rows = sprite.length;
    const cols = sprite[0].length;
    const startX = cx - (cols * pw) / 2;
    const startY = cy - (rows * pw);

    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            let ch = sprite[r][c];
            if (ch === '.') continue;

            let color = primaryColor;
            if (ch === 'L') color = '#ffffff';
            if (ch === 'W') color = '#112233';
            if (ch === 'R') color = '#ff0000';
            if (ch === 'B') color = '#111111';
            if (ch === 'D') color = '#333333';

            ctx.fillStyle = color;
            ctx.fillRect(startX + c * pw, startY + r * pw, pw, pw);
        }
    }
}

function drawHUD(env) {
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, 320, 18);

    ctx.font = '10px "Courier New", monospace';
    ctx.fillStyle = '#00ffff';
    ctx.fillText(`${Math.round(speed)} KM/H`, 8, 13);

    let curMin = Math.floor(elapsedTime / 60);
    let curSec = Math.floor(elapsedTime % 60);
    let mStr = curMin < 10 ? '0' + curMin : curMin;
    let sStr = curSec < 10 ? '0' + curSec : curSec;

    ctx.fillStyle = '#ffffff';
    ctx.fillText(`${mStr}:${sStr}/40:00`, 90, 13);

    ctx.fillStyle = '#ff0055';
    ctx.fillText(`VIDAS:${vidas}`, 175, 13);

    ctx.fillStyle = '#ffe600';
    ctx.fillText(`CARS:${carsPassed}`, 240, 13);

    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 212, 320, 12);
    ctx.fillStyle = '#ff0055';
    ctx.fillText(`ETAPA: ${env.name}`, 8, 221);
}

function loop(timestamp) {
    let dt = (timestamp - lastTime) / 1000;
    if (isNaN(dt) || dt > 0.1) dt = 0.1;
    lastTime = timestamp;

    update(dt);
    render();

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
