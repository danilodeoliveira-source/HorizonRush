<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Jogo de Carros</title>
  <style>
    body {
      margin: 0;
      background-color: #1a1a1a;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    #hud {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    #gameCanvas {
      background-color: #333333;
      border: 3px solid #ffffff;
    }
  </style>
</head>
<body>
  <div id="hud">Vidas: <span id="vidas">5</span></div>
  <canvas id="gameCanvas" width="800" height="400"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const elementoVidas = document.getElementById('vidas');

    // Configurações
    let vidas = 5; // 5 vidas
    let velocidadeCarro = 2; // Velocidade reduzida para carros mais lentos

    // Jogador
    const jogador = {
      x: 380,
      y: 320,
      largura: 40,
      altura: 60,
      cor: '#3498db'
    };

    // Carros vindo na contramão (de cima para baixo)
    const carros = [
      { x: 200, y: -60, largura: 40, altura: 60 },
      { x: 400, y: -200, largura: 40, altura: 60 },
      { x: 600, y: -350, largura: 40, altura: 60 }
    ];

    function atualizarHUD() {
      elementoVidas.textContent = vidas;
    }

    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Desenha o Jogador
      ctx.fillStyle = jogador.cor;
      ctx.fillRect(jogador.x, jogador.y, jogador.largura, jogador.altura);

      // Atualiza e desenha carros na contramão
      ctx.fillStyle = '#e74c3c';
      carros.forEach(carro => {
        carro.y += velocidadeCarro; // Carros descem a tela na contramão

        // Reseta o carro no topo quando ele sai por baixo
        if (carro.y > canvas.height) {
          carro.y = -60;
          carro.x = Math.random() * (canvas.width - carro.largura);
        }

        ctx.fillRect(carro.x, carro.y, carro.largura, carro.altura);
      });

      requestAnimationFrame(loop);
    }

    atualizarHUD();
    loop();
  </script>
</body>
</html>
